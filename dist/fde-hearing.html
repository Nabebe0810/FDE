<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>要件ヒアリング</title>
<meta name="description" content="非エンジニアの回答から要件を構造化する、AIを使わないヒアリングツール">
<style>
:root {
  --bg: linear-gradient(160deg,#ece8ff 0%,#f7e9f0 55%,#ffe9e2 100%); --surface: #ffffff; --surface-2: #efede8; --ink: #1d1d1b; --ink-2: #5d5b55; --line: #dcd9d1;
  --accent: #5b4fc4; --accent-ink: #ffffff; --go: #c6f36d; --go-ink: #1b2a05; --yes: #2f6f4f; --no: #9a3b32; --neutral: #6b6a64; --warn: #8a5a00;
  --focus: #1f6feb; --radius: 24px; --shadow: 0 12px 40px rgba(60,40,120,.12);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161714; --surface: #1f201d; --surface-2: #2a2b27; --ink: #ecebe6; --ink-2: #a9a79f; --line: #3a3b36;
    --accent: #7fb8a4; --accent-ink: #10221c; --yes: #7fc49e; --no: #e08a80; --neutral: #a9a79f; --warn: #e3b25c;
    --shadow: 0 6px 24px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161714; --surface: #1f201d; --surface-2: #2a2b27; --ink: #ecebe6; --ink-2: #a9a79f; --line: #3a3b36;
  --accent: #7fb8a4; --accent-ink: #10221c; --yes: #7fc49e; --no: #e08a80; --neutral: #a9a79f; --warn: #e3b25c;
  --shadow: 0 6px 24px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); background-attachment: fixed; color: var(--ink); }
body { min-height: 100dvh; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
.wide { max-width: 1100px; }

/* ヘッダーと進み具合 */
.top { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 8px; }
.brand { font-weight: 700; font-size: 15px; }
.top .actions { display: flex; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.progress { background: var(--surface-2); border-radius: 999px; height: 8px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin: 4px 2px 12px; gap: 8px; flex-wrap: wrap; }

/* カード */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px; position: relative; touch-action: pan-y; user-select: none; transition: transform .18s ease, opacity .18s; }
.card.dragging { transition: none; }
.card .stage { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.card h1 { font-size: 21px; line-height: 1.5; margin: 0 0 8px; font-weight: 700; }
.card .help { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; white-space: pre-wrap; }
.card .decides { font-size: 12px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 14px; }
.swipe-hint { position: absolute; top: 14px; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 8px; opacity: 0; pointer-events: none; }
.swipe-hint.r { right: 14px; color: var(--yes); border: 2px solid var(--yes); }
.swipe-hint.l { left: 14px; color: var(--no); border: 2px solid var(--no); }
.swipe-hint.u { left: 50%; transform: translateX(-50%); color: var(--neutral); border: 2px solid var(--neutral); }

.opts { display: grid; gap: 8px; margin: 8px 0; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.opt .k { font-size: 12px; color: var(--ink-2); min-width: 1.2em; }
.opt .h { display: block; font-size: 12px; color: var(--ink-2); }
.opt[aria-pressed="true"], .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 40px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.yn button { min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 700; }
.yn .y { border-color: var(--yes); color: var(--yes); }
.yn .n { border-color: var(--no); color: var(--no); }
.yn .m { grid-column: 1 / -1; min-height: 44px; font-size: 15px; font-weight: 500; color: var(--neutral); }

/* スライダー */
.slider { margin: 16px 4px 8px; }
.slider .now { text-align: center; font-size: 20px; font-weight: 700; min-height: 32px; }
.slider .now.untouched { color: var(--ink-2); font-weight: 500; font-size: 15px; }
.slider input[type=range] { width: 100%; height: 36px; accent-color: var(--accent); }
.ticks { display: flex; justify-content: space-between; gap: 4px; }
.ticks button { flex: 1; border: none; background: none; font-size: 11px; color: var(--ink-2); padding: 4px 0; line-height: 1.3; }
.ticks button.on { color: var(--ink); font-weight: 700; }

/* カード仕分け（3方向） */
.deck { margin: 10px 0; }
.deck .mini { background: var(--surface-2); border-radius: 14px; padding: 18px 16px; min-height: 120px; text-align: center; touch-action: pan-y; transition: transform .15s; }
.deck .mini b { display: block; font-size: 18px; margin-bottom: 4px; }
.deck .mini span { font-size: 13px; color: var(--ink-2); }
.deck .count { text-align: center; font-size: 12px; color: var(--ink-2); margin: 6px 0; }
.deck .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.deck .three button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; padding: 4px; }
.deck .three .y { border-color: var(--yes); color: var(--yes); }
.deck .three .n { border-color: var(--no); color: var(--no); }
.sorted { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; }
.sorted span { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); }

/* 配分・並べ替え・表 */
.pts .row { display: grid; grid-template-columns: 1fr 120px 28px; align-items: center; gap: 8px; margin: 6px 0; }
.pts .left { text-align: center; font-weight: 700; margin: 6px 0; }
.rank .opt .k { font-weight: 700; color: var(--accent); }
.matrix { width: 100%; border-collapse: collapse; font-size: 14px; }
.matrix th, .matrix td { border-bottom: 1px solid var(--line); padding: 8px 4px; text-align: center; }
.matrix th:first-child, .matrix td:first-child { text-align: left; }
.matrix button { min-width: 40px; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); }
.matrix button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input[type=text], input[type=number], input[type=month], textarea, select { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px; font-size: 16px; }
textarea { min-height: 120px; resize: vertical; }
.steps li { margin: 6px 0; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* 下の操作 */
.special { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.special button { flex: 1; min-width: 92px; border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 8px; font-size: 13px; color: var(--ink-2); }
.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 14px; }
.nav button { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.nav .go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.nav .go:disabled { opacity: .4; }
.kbd { font-size: 11px; color: var(--ink-2); text-align: center; margin-top: 10px; }
.toast { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; z-index: 10; max-width: calc(100% - 32px); white-space: nowrap; font-size: 14px; box-shadow: var(--shadow); }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 2px 10px; white-space: nowrap; }

/* 開始・完了 */
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px; margin-bottom: 12px; }
.panel h1 { font-size: 22px; margin: 0 0 8px; }
.panel h2 { font-size: 17px; margin: 16px 0 8px; }
.panel p { margin: 6px 0; }
.field { margin: 12px 0; }
.field label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.primary { width: 100%; min-height: 52px; border-radius: 14px; border: none; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; }
.secondary { width: 100%; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); margin-top: 8px; }
.note { font-size: 12px; color: var(--ink-2); }
.list-sessions button { display: block; width: 100%; text-align: left; margin: 6px 0; }

/* FDE 画面 */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); position: sticky; top: 0; }
.scroll { overflow-x: auto; }
.badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.badge.ok { background: color-mix(in srgb, var(--yes) 20%, var(--surface)); }
.badge.ng { background: color-mix(in srgb, var(--no) 20%, var(--surface)); }
.badge.w { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); }
pre.md { white-space: pre-wrap; font-size: 12px; background: var(--surface-2); padding: 12px; border-radius: 10px; max-height: 60vh; overflow: auto; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { .card, .deck .mini, .progress > i { transition: none; } }

/* 刷新：参考デザイン（カード型・選択肢カード・ピル・ライムの次へ） */
.card h1 { font-size: 24px; letter-spacing: .01em; }
.card .stage { text-transform: uppercase; letter-spacing: .12em; font-family: ui-monospace, monospace; }
.opt { border-radius: 16px; padding: 16px; transition: border-color .15s, background .15s, transform .1s; }
.opt:active { transform: scale(.98); }
.opt .k { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); font-size: 0; flex: none; }
.opt[aria-pressed="true"] .k { border: 7px solid var(--accent); }
.chip { padding: 10px 18px; transition: all .15s; }
.nav .go { background: var(--go); color: var(--go-ink); border-color: var(--go); border-radius: 999px; }
.nav button { border-radius: 999px; }
.progress { height: 6px; }
.primary { background: var(--accent); border-radius: 999px; }
.yn button, .deck .three button, .special button { border-radius: 16px; }

</style>
</head>

<script>
/*
 * util.js — 決定論的な小道具（文字正規化・辞書照合・テンプレート展開）
 * ブラウザ（file:// でも動く classic script）と Node（require）の両方で使えるよう UMD 風に書く。
 */
(function (root) {
  'use strict';

  /** 全角英数・記号を半角へ、カタカナ長音などはそのまま。比較用の正規化。 */
  function normalize(text) {
    if (text == null) return '';
    return String(text)
      .replace(/[！-～]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
      .replace(/　/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  /** 辞書（語の配列）のうち text に含まれる語を返す。重複なし・辞書の順。 */
  function matchWords(text, words) {
    const t = normalize(text);
    if (!t) return [];
    const hits = [];
    for (const w of words || []) {
      const nw = normalize(w);
      if (nw && t.includes(nw) && !hits.includes(w)) hits.push(w);
    }
    return hits;
  }

  /** 正規表現パターン（文字列）の配列で照合し、一致した部分文字列を返す。 */
  function matchPatterns(text, patterns) {
    const t = normalize(text);
    const hits = [];
    for (const p of patterns || []) {
      const re = new RegExp(p, 'g');
      let m;
      while ((m = re.exec(t)) !== null) {
        hits.push(m[0]);
        if (m[0] === '') re.lastIndex++;
      }
    }
    return hits;
  }

  /** {{a.b}} 形式の置換。値がなければ fallback（既定は「それ」）。 */
  function template(str, vars, fallback) {
    if (!str) return '';
    return String(str).replace(/\{\{\s*([\w.\-@]+)\s*\}\}/g, (_, key) => {
      const v = key.split('.').reduce((o, k) => (o == null ? undefined : o[k]), vars);
      if (v == null || v === '') return fallback == null ? 'それ' : fallback;
      return Array.isArray(v) ? v.join('、') : String(v);
    });
  }

  function clone(o) {
    return o == null ? o : JSON.parse(JSON.stringify(o));
  }

  function uniq(arr) {
    return Array.from(new Set(arr));
  }

  /** 安定ソート（同点は key で辞書順）— 同じ入力なら必ず同じ順になる。 */
  function stableSortBy(arr, scoreFn, keyFn) {
    return arr
      .map((x, i) => ({ x, i, s: scoreFn(x), k: keyFn ? keyFn(x) : String(i) }))
      .sort((a, b) => (b.s - a.s) || (a.k < b.k ? -1 : a.k > b.k ? 1 : 0) || (a.i - b.i))
      .map((o) => o.x);
  }

  function round(n, d) {
    const f = Math.pow(10, d == null ? 2 : d);
    return Math.round(n * f) / f;
  }

  /** 決定論的な連番 ID（状態の中のカウンタを使う。乱数・時刻を使わない） */
  function nextId(state, prefix) {
    state.counters = state.counters || {};
    state.counters[prefix] = (state.counters[prefix] || 0) + 1;

<script>
/*
 * cond.js — 条件式（発動条件・スキップ条件・導出ルール）の評価器
 *
 * 条件は JSON で書く。AI による意味推定は一切しない。評価対象は「構造化された項目（スロット）」
 * 「検出フラグ」「有効な論点」「回答済みの質問」だけ。
 *
 *  { "slot": "PRJ.audience", "eq": "社外" }        値が等しい
 *  { "slot": "X", "in": ["a","b"] }                値がどれか
 *  { "slot": "X", "has": "a" }                     複数選択の値に a を含む
 *  { "slot": "X", "hasAny": ["a","b"] }            複数選択の値にどれかを含む
 *  { "slot": "X", "gte": 10 } / "lte" / "gt" / "lt" 数値比較
 *  { "slot": "X", "known": true }                  回答済み（値あり）
 *  { "slot": "X", "resolved": true }               回答済み・該当しない・わからない・後で確認のどれか
 *  { "slot": "X", "status": "dontknow" }           状態の一致
 *  { "slot": "X", "count_gte": 2 } / "count_lte"     複数選択・一覧の件数
 *  { "slot": "X", "gtSlot": "Y" } / "ltSlot"       数値スロットどうしの比較
 *  { "slot": "X", "at": "行", "in": [..] }         マトリクス・配分入力の1要素を取り出して比較
 *  { "flag": "abstract@BR.problem" }               検出フラグが立っている（* で前方一致可）
 *  { "topic": "data" }                             論点が有効
 *  { "answered": "Q-PRJ-001" }                     その質問に回答済み
 *  { "persona": ["経営者","管理者"] }              回答者の立場
 *  { "det": "abstract" }                           直前の回答の検出結果（追加質問の判定専用）
 *  { "hyp": "HC-VOLUME", "status": "alive" }       仮説の状態
 *  { "all": [..] } / { "any": [..] } / { "not": {..} }
 *  値に "$param" と書くと、繰り返し質問のパラメータ（例：エンティティ名）に置き換わる。

    if (c.all) return c.all.every((x) => evaluate(x, state, ctx));
    if (c.any) return c.any.some((x) => evaluate(x, state, ctx));

    if (c.answered) return !!(state.asked && state.asked[slotKey(c.answered, ctx)]);

<script>
/*
 * detect.js — 自由記述の「形式」判定（意味は判定しない）
 *
 * できること：語彙辞書と正規表現による「手がかり」の検出（数字・日付・単位・推量の言い回し・
 *   手段の言葉・困りごとの言葉・抽象語）。結果は「追加質問を出すかどうか」の判断材料にだけ使う。
 * できないこと（明示的な制限）：文の意味の理解、言い換えの同一性判定、皮肉・否定のスコープ、
 *   自由文どうしの意味的な矛盾。これらは人間レビュー（FDE）に回す。
 * 判定はすべて「原文を保持したまま」付ける注記であり、原文を書き換えない。
 */

  'use strict';
  const util = typeof require === 'function' ? require('./util.js') : root.FDE.util;

  /**
   * @param {string} text 原文
   * @param {object} lex 語彙辞書（data/rules/lexicon.json）
   * @param {object} p   閾値（params.detect）
   */
  function analyzeText(text, lex, p) {
    p = p || {};

    const norm = util.normalize(raw);
    const len = norm.replace(/\s/g, '').length;
    const hits = {
      number: util.matchPatterns(raw, lex.patterns.number),
      date: util.matchPatterns(raw, lex.patterns.date),
      unit: util.matchPatterns(raw, lex.patterns.unit),
      timeRef: util.matchWords(raw, lex.words.time_reference),
      abstract: util.matchWords(raw, lex.words.abstract),
      solution: util.matchWords(raw, lex.words.solution),
      problem: util.matchWords(raw, lex.words.problem),
      hedge: util.matchWords(raw, lex.words.hedge),
      fact: util.matchWords(raw, lex.words.fact),
      evaluative: util.matchWords(raw, lex.words.evaluative),
      desire: util.matchWords(raw, lex.words.desire),
      correction: util.matchWords(raw, lex.words.correction),
      plural: util.matchWords(raw, lex.words.vague_plural),

      short: len > 0 && len < minChars,
      // 抽象的：短すぎる、または抽象語／ぼかし語があり具体の手がかりが一つもない
      abstract: len > 0 && concrete === 0 && (len < minChars || hits.abstract.length > 0 || hits.plural.length > 0),
      // 解決策だけ：手段の言葉があり、困りごとの言葉がない

      // 観察事実の手がかりがある（事実の可能性。確定ではない）
      factLike: hits.fact.length + hits.date.length + hits.timeRef.length > 0 && hits.hedge.length === 0,

      wantsChange: hits.desire.length > 0,
      correction: hits.correction.length > 0,

    if (det.speculative) epistemicHint = 'guess';
    else if (det.factLike) epistemicHint = 'fact';
    else if (det.wantsChange) epistemicHint = 'wish';

      .filter((k) => hits[k].length)
      .map((k) => k + ':' + util.uniq(hits[k]).slice(0, 5).join('/'));

/*
 * derive.js — スロットから決定論的に導くもの

 *   ・矛盾（contradictions）の検出 — 構造化項目どうしだけ
 *   ・分岐フラグ（branches）— 「KPIが不明」「権限が未定義」など
 *   ・要件変換（mappings）— 推定した要件は必ず「未確認」で作る
 * どれも「同じスロット → 同じ結果」の純関数。

(function (root) {
  'use strict';
  const isNode = typeof require === 'function';
  const cond = isNode ? require('./cond.js') : root.FDE.cond;
  const util = isNode ? require('./util.js') : root.FDE.util;

  function slotVal(state, key) {

  /** テンプレート用の変数（スロット値＋ラベル） */

    for (const k of Object.keys(state.slots)) {
      const parts = k.split('.');
      let o = v;
      for (let i = 0; i < parts.length - 1; i++) { o[parts[i]] = o[parts[i]] || {}; o = o[parts[i]]; }
      const val = slotVal(state, k);

          reqs[key] = {

            text: util.template(e.text || e.title, v, '（未定）'),
            plain: e.plain ? util.template(e.plain, v, '（未定）') : null,

 * tech.js — ビジネス条件と技術構成の接続（3段：ノックアウト → 重み付け → ADR 下書き）
 *

 * 出力：候補構成ごとの状態（候補／要確認／除外）、理由、トレードオフ、足りない入力
 * 数値（上限・料金）は data/rules/tech.json に出典と確認日つきで置き、ここでは判定だけをする。

  const cond = isNode ? require('./cond.js') : root.FDE.cond;
  const util = isNode ? require('./util.js') : root.FDE.util;

  function evaluate(db, state) {

        dbVersion: db.version,
        ruleVersion: db.params.ruleVersion,

        intent: '回答者間の食い違いを事実で確かめる（対置型）', technique: '対置型',

      iid, id: 'C', type: 'contrast', step: 7, topic: 'core', persona: '全員', importance: r.severity >= 3 ? 5 : 4, costSec: 15,
      text: util.template(r.question, v), help: util.template(r.help || '', v),

    if (o.setSlot) for (const k of Object.keys(o.setSlot)) setSlot(db, state, k, { value: o.setSlot[k], status: 'answered', origin: 'selected', qid: q.id, seq: e.seq, resolvedConflict: true });
    if (o.flags) for (const f of o.flags) state.detFlags[f] = true;

  function setSlot(db, state, key, s) {

    if (prev && prev.by && prev.by !== state.respondent && cond.KNOWN.includes(prev.status) && s.status === 'answered' && !s.resolvedConflict &&
        JSON.stringify(prev.value) !== JSON.stringify(s.value) && db.slots[key] && db.slots[key].type !== 'text') {

    }
    if (prev && prev.history) next.history = prev.history.concat([{ value: prev.value, status: prev.status, by: prev.by, seq: prev.seq }]);

  }

  function stillValid(db, state, q) {
    if (q.type === 'confirm') return !!state.reqs[q.reqKey];

    if (q.queuedOnly) return true; // 追加質問は予約された時点の判断を尊重
    const ctx = { param: q.param };
    if (q.trigger && !cond.evaluate(q.trigger, state, ctx)) return false;
    // 論点そのものが無効になった（例：「一般の個人向け」→「社内向け」に訂正）なら、その論点の回答は使わない
    if (q.topic && state.topics[q.topic] && !state.topics[q.topic].active) return false;

  }

  /** 導出物を作り直す（S3 論点・S4 仮説・矛盾・分岐・S9 要件・技術候補） */
  function recompute(db, state) {
    state.flags = Object.assign({}, state.detFlags);
    state.topics = derive.computeTopics(state, db);
    const br = derive.computeBranches(state, db);
    state.branches = br;
    Object.assign(state.flags, Object.fromEntries(Object.keys(br.flags).map((k) => [k, true])));
    state.topics = derive.computeTopics(state, db); // 分岐フラグで有効になる論点を反映

  }

  function updateStage(db, state) {
    const intakeDone = db.questions.filter((q) => q.phase === '00_受付' && !q.generic && !q.queuedOnly)
      .every((q) => state.asked[q.id] || (q.trigger && !cond.evaluate(q.trigger, state)) || (q.persona !== '全員' && q.persona && ![].concat(q.persona).includes(state.persona)));
    if (!intakeDone) { state.stage = 'intake'; return; }
    state.stage = 'loop';
    if (state.manualConfirm || state.stopLoop) state.stage = 'confirm';
  }

  // ---------------- 公開 API ----------------
  function answer(db, session, iid, payload) {
    const p = payload || {};
    addEvent(session, { type: 'answer', iid, kind: p.kind || 'value', value: p.value, raw: p.raw, epistemic: p.epistemic, ms: p.ms || 0, note: p.note });
    return replay(db, session);
  }
  function edit(db, session, targetSeq, payload) {
    const orig = session.log.find((x) => x.seq === targetSeq);
    if (!orig) throw new Error('訂正対象の回答がありません: ' + targetSeq);
    const p = payload || {};
    addEvent(session, { type: 'edit', target: targetSeq, iid: orig.iid, kind: p.kind || 'value', value: p.value, raw: p.raw, epistemic: p.epistemic, ms: p.ms || 0, note: p.note });

  function retract(db, session, targetSeq) {

  function goConfirm(db, session) {
    addEvent(session, { type: 'stage', to: 'confirm' });
    return replay(db, session);
  }
  /** FDE が自由記述を読んで要件への反映を確認した印（R09）。回答そのものは変えない */
  function markReviewed(db, session, seqs) {
    addEvent(session, { type: 'fdeReview', seqs });
    return replay(db, session);
  }
  /** 有効な（訂正されていない）回答イベント */
  function activeAnswers(session) {

    return session.log.filter((e) => (e.type === 'answer' || e.type === 'edit') && !sup[e.seq]);

<script>
/*
 * select.js — S5「次の意思決定に重要な質問の選択」と終了判定
 *
 * 決定論的なルール順位（Tier）＋ スコア。重み・閾値は data/params.json の初期設計値で、
 * 実証済みの値ではない（実測ログで調整する前提）。同点は質問IDの辞書順で決まる。
 *
 *  Tier 0  未解決の矛盾の確認（対置型）
 *  Tier 1  直前の回答から予約された追加質問（深掘り・二手目）— 新しいものから
 *  Tier 2  必須確認項目（案件の型・分岐フラグで必須になったもの）
 *  Tier 3  スコア順
 *  終了    必須が残っておらず、最高スコアが停止閾値未満／時間の上限に達した → S10 顧客確認へ
 */
(function (root) {
  'use strict';
  const isNode = typeof require === 'function';
  const cond = isNode ? require('./cond.js') : root.FDE.cond;
  const util = isNode ? require('./util.js') : root.FDE.util;
  const derive = isNode ? require('./derive.js') : root.FDE.derive;
  const engine = isNode ? require('./engine.js') : root.FDE.engine;

  const DEFAULT_COST = { yesno: 8, single: 15, multi: 25, number: 15, scale: 12, text: 45, longtext: 90, cards: 60, steps: 120, rank: 40, date: 15 };

  function costOf(q) {
    return q.costSec || DEFAULT_COST[(q.input && q.input.type) || 'single'] || 20;
  }

  /** 後続影響：この質問のスロットを条件に使う質問の数（DB 読み込み時に一度だけ計算） */
  function downstreamIndex(db) {
    if (db._down) return db._down;
    const count = {};
    const add = (slots) => slots.forEach((s) => { count[s] = (count[s] || 0) + 1; });
    for (const q of db.questions) add(cond.referencedSlots(q.trigger));
    for (const m of db.rules.mappings) add(cond.referencedSlots(m.when));
    for (const k of db.rules.tech.knockouts) add(cond.referencedSlots(k.when));
    for (const c of db.rules.contradictions) add(cond.referencedSlots(c.when));
    db._down = count;
    return count;
  }

  function personaOk(q, state) {
    if (!q.persona || q.persona === '全員') return true;
    return [].concat(q.persona).includes(state.persona) || [].concat(q.persona).includes('全員');
  }

  /** 繰り返し質問（forEach）を具体的な iid に展開 */
  function instances(q, state) {
    if (!q.forEach) return [{ iid: q.id, param: undefined }];
    const v = derive.slotVal(state, q.forEach);
    return (Array.isArray(v) ? v : []).map((p) => ({ iid: q.id + '@' + p, param: p }));
  }

  function isMandatory(q, state, ctx) {
    const pat = q.slot ? q.slot.replace('{param}', '{e}') : null;
    if (pat && state.branches.mandatorySlots[pat]) return 'branch:' + state.branches.mandatorySlots[pat];
    if (q.mandatory === true) return 'always';
    if (q.mandatory && typeof q.mandatory === 'object' && cond.evaluate(q.mandatory, state, ctx)) return 'conditional';
    return false;
  }

  /** 候補を列挙し、スコアの内訳を付けて返す（説明可能性のため内訳を必ず保持） */
  function candidates(db, state) {
    const P = db.params;
    const w = P.weights;
    const down = downstreamIndex(db);
    const remainingMin = P.time.targetMin - state.elapsedSec / 60;
    const pressure = remainingMin < P.time.pressureMin;
    const askedGroups = {};
    for (const iid of Object.keys(state.asked)) {
      const q = db.qIndex[engine.parseIid(iid).qid];
      if (q && q.dedupe) askedGroups[q.dedupe] = true;
    }
    const techMissing = (state.tech && state.tech.missingInputs) || [];
    const discriminating = {};
    for (const h of Object.values(state.hyps)) {
      if (h.status === 'alive' && state.families[h.family] && state.families[h.family].open) {
        for (const qid of h.discriminators) discriminating[qid] = (discriminating[qid] || 0) + 1;
      }
    }
    const out = [];
    for (const q of db.questions) {
      if (q.generic || q.queuedOnly) continue;
      if (!personaOk(q, state)) continue;
      if (q.topic && !(state.topics[q.topic] && state.topics[q.topic].active)) continue;
      if (q.dedupe && askedGroups[q.dedupe]) continue;
      for (const inst of instances(q, state)) {
        if (state.asked[inst.iid]) continue;
        const ctx = { param: inst.param };
        if (q.trigger && !cond.evaluate(q.trigger, state, ctx)) continue;
        if (q.skipIf && cond.evaluate(q.skipIf, state, ctx)) continue;
        // 前提の混入防止：前提にしている項目が回答済みでなければ出さない
        if (q.presupposes && !q.presupposes.every((k) => state.slots[cond.slotKey(k, ctx)] && cond.KNOWN.includes(state.slots[cond.slotKey(k, ctx)].status))) continue;
        const slot = q.slot ? cond.slotKey(q.slot, ctx) : null;
        if (slot && state.slots[slot] && cond.RESOLVED.includes(state.slots[slot].status)) continue; // 既に分かっていることは聞かない
        const meta = (slot && (db.slots[slot] || db.slots[q.slot])) || {};
        const U = slot ? (meta.weight || 1) : 0.5;
        const decides = (q.decides || []).length;
        const D = decides * 0.5 + (discriminating[q.id] || 0) * 1 + (slot && techMissing.includes(slot) ? 1 : 0);
        const I = (q.importance || 3) / 5;
        const F = Math.log2(1 + (slot ? (down[q.slot] || 0) : 0));
        const B = state.branches.boosts[q.topic] || 0;
        const C = costOf(q) / 60;
        const pi = P.phaseOrder.indexOf(q.phase);
        const O = pi < 0 ? 0 : 1 - pi / P.phaseOrder.length; // 会話の自然な順（目的→困りごと→流れ→…）への小さな寄与
        const mandatory = isMandatory(q, state, ctx);
        if (pressure && !mandatory && (q.importance || 3) < P.time.minImportanceUnderPressure) continue;
        const score = w.uncertainty * U + w.decision * D + w.importance * I + w.downstream * F + w.branch * B + w.phaseOrder * O - w.cost * C * (pressure ? 2 : 1);
        out.push({
          iid: inst.iid, qid: q.id, param: inst.param, tier: mandatory ? 2 : 3, mandatory, score: util.round(score, 3),
          parts: { U, D: util.round(D, 2), I, F: util.round(F, 2), B, O: util.round(O, 2), C: util.round(C, 2), pressure },
          cost: costOf(q),
        });
      }
    }
    return util.stableSortBy(out, (c) => (c.tier === 2 ? 1000 : 0) + c.score, (c) => c.iid);
  }

  function confirmCandidates(db, state) {
    const order = db.params.confirm.typeOrder;
    const list = state.reqOrder
      .map((k) => state.reqs[k])
      .filter((r) => r.confirmImportant && r.plain && r.status === 'unconfirmed' && !state.asked['CONFIRM@' + r.key]);
    // Must（実装を止める判定に効くもの）を先に、次に種類の順（事業の思い→事業要求→制約→機能…）
    const rank = (r) => (r.moscow === 'Must' ? 1000 : 0) - (order.indexOf(r.type) < 0 ? 99 : order.indexOf(r.type));
    return util.stableSortBy(list, rank, (r) => r.key)
      .slice(0, Math.max(0, db.params.confirm.maxCards - Object.keys(state.asked).filter((k) => k.startsWith('CONFIRM@')).length));
  }

  /**
   * 次の一問を決める。
   * @returns {{stage, iid, tier, why, score, parts}|{stage:'done'}}
   */
  function next(db, state) {
    const P = db.params;
    // Tier 0：矛盾
    const contra = Object.values(state.contradictions)
      .filter((c) => c.status === 'open' && !state.asked[c.question])
      .sort((a, b) => b.severity - a.severity || (a.id < b.id ? -1 : 1));
    // Tier 1：予約された追加質問（新しい順＝話の流れを切らない）
    const queue = state.queue
      .filter((x) => !state.asked[x.iid] && engine.resolveQuestion(db, state, x.iid))
      .filter((x) => { const q = engine.resolveQuestion(db, state, x.iid); return !q.slot || !(state.slots[q.slot] && cond.RESOLVED.includes(state.slots[q.slot].status)); })
      .sort((a, b) => b.fromSeq - a.fromSeq || (a.iid < b.iid ? -1 : 1));

    const hardStop = state.elapsedSec / 60 >= P.time.hardMaxMin;
    const inConfirm = state.stage === 'confirm' || hardStop;

    if (!inConfirm) {
      if (contra.length) return { stage: state.stage, iid: contra[0].question, tier: 0, why: '回答どうしの食い違いを確かめる：' + contra[0].label };
      if (queue.length) return { stage: state.stage, iid: queue[0].iid, tier: 1, why: queue[0].why };
      const cands = candidates(db, state);
      // 受付段階では受付の質問だけ（S1〜S4 を先に終える）
      // 受付は会話として自然な固定順（order）で進める
      const pool = state.stage === 'intake'
        ? cands.filter((c) => db.qIndex[c.qid].phase === '00_受付').sort((a, b) => (db.qIndex[a.qid].order || 99) - (db.qIndex[b.qid].order || 99))
        : cands;
      const top = pool[0];
      const softStop = state.elapsedSec / 60 >= P.time.targetMin;
      if (top && (state.stage === 'intake' || top.tier === 2 || (!softStop && top.score >= threshold(P, state)))) {
        return { stage: state.stage, iid: top.iid, tier: top.tier, score: top.score, parts: top.parts, why: explain(db, top) };
      }
    }
    // S10 中の追加質問（「ちがう」の後の特定など）
    if (inConfirm && queue.length) return { stage: 'confirm', iid: queue[0].iid, tier: 1, why: queue[0].why };
    // S10：顧客確認
    const conf = confirmCandidates(db, state);
    if (conf.length) return { stage: 'confirm', iid: 'CONFIRM@' + conf[0].key, tier: 9, why: '推定した内容を平易な文で確認する' };
    return { stage: 'done' };
  }

  /** 任意の質問を出す閾値：時間がたつほど上がる（初期設計値） */
  function threshold(P, state) {
    return P.stopScore + (P.stopScoreRisePerTarget || 0) * Math.min(1, state.elapsedSec / 60 / P.time.targetMin);
  }

  function explain(db, c) {
    const q = db.qIndex[c.qid];
    const bits = [];
    if (c.mandatory) bits.push('必須確認（' + c.mandatory + '）');
    if (c.parts.D > 0) bits.push('意思決定に影響');
    if (c.parts.F > 0) bits.push('後続の質問・判定に影響');
    if (c.parts.B > 0) bits.push('分岐フラグで優先');
    if (c.parts.pressure) bits.push('残り時間が少ないため重要度の高い質問だけ');
    return (q.intent || '') + (bits.length ? ' ／ ' + bits.join('・') : '');
  }

  /** 残りの負荷の見積もり（決定論的・保守側に丸める） */
  function estimate(db, state) {
    const P = db.params;
    const cands = candidates(db, state);
    const mand = cands.filter((c) => c.tier === 2);
    const opt = cands.filter((c) => c.tier === 3 && c.score >= threshold(P, state));
    const queueCost = state.queue.filter((x) => !state.asked[x.iid]).length * 30;
    let sec = mand.reduce((a, c) => a + c.cost, 0) + opt.reduce((a, c) => a + c.cost, 0);
    sec = sec * (1 + P.time.expectedFollowupRate) + queueCost;
    const confirmSec = Math.min(P.confirm.maxCards, state.reqOrder.filter((k) => state.reqs[k].confirmImportant && state.reqs[k].status === 'unconfirmed').length) * 8;
    const remainingBudget = Math.max(0, P.time.targetMin * 60 - state.elapsedSec);
    const loopSec = Math.min(sec, remainingBudget);
    const totalSec = loopSec + confirmSec;
    const avg = cands.length ? (mand.concat(opt).reduce((a, c) => a + c.cost, 0) / Math.max(1, mand.length + opt.length)) : 20;
    // 進み具合：有効な論点の重要項目のうち、解決済みの割合
    const crit = Object.keys(db.slots).filter((k) => db.slots[k].critical && topicActiveFor(db, state, k));
    const done = crit.filter((k) => state.slots[k] && cond.RESOLVED.includes(state.slots[k].status));
    return {
      remainingMin: Math.ceil(totalSec / 60),
      remainingQuestions: Math.round(loopSec / Math.max(8, avg)) + Math.ceil(confirmSec / 8),
      elapsedMin: util.round(state.elapsedSec / 60, 1),
      criticalResolved: done.length, criticalTotal: crit.length,
      progress: crit.length ? done.length / crit.length : 0,
      mandatoryLeft: mand.length,
    };
  }

  function topicActiveFor(db, state, slotKey) {
    const quality = isNode ? require('./quality.js') : root.FDE.quality;
    return quality.activeTopic(db, state, slotKey);
  }

  const api = { next, candidates, estimate, confirmCandidates, costOf, downstreamIndex, threshold };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else { root.FDE = root.FDE || {}; root.FDE.select = api; }
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/*
 * quality.js — 未決定事項・人間レビュー待ち・ヒアリング品質指標・仕様確定判定
 * 品質は「質問の多さ」ではなく、曖昧さの解消・事実と仮説の区別・トレーサビリティで測る。
 */
(function (root) {
  'use strict';
  const isNode = typeof require === 'function';
  const cond = isNode ? require('./cond.js') : root.FDE.cond;
  const util = isNode ? require('./util.js') : root.FDE.util;
  const engine = isNode ? require('./engine.js') : root.FDE.engine;

  function activeTopic(db, state, key) {
    const m = db.slots[key];
    if (!m || m.template) return false;
    // エンティティ別の項目は、そのエンティティを「扱う」と答えたときだけ対象
    if (m.pattern) {
      const ents = state.slots['DAT.things'] && Array.isArray(state.slots['DAT.things'].value) ? state.slots['DAT.things'].value : [];
      if (!ents.includes(key.split('.')[1])) return false;
    }
    const t = m.topic;
    return !t || (state.topics[t] && state.topics[t].active);
  }

  /** 未決定事項（すべて導出。手入力ではなく状態から毎回作る） */
  function openIssues(db, state) {
    const list = [];
    const push = (o) => list.push(Object.assign({ id: 'OI-' + String(list.length + 1).padStart(3, '0') }, o));
    for (const k of Object.keys(db.slots)) {
      const m = db.slots[k];
      if (!m.critical || !activeTopic(db, state, k)) continue;
      const s = state.slots[k];
      if (!s) push({ kind: '未確認', slot: k, label: m.label, blocking: m.weight >= 3, owner: m.askWho || '顧客', reason: 'まだ聞けていない' });
      else if (s.status === 'dontknow') push({ kind: 'わからない', slot: k, label: m.label, blocking: m.weight >= 3, owner: m.askWho || '顧客（担当者を確認）', reason: '回答者は「わからない」' });
      else if (s.status === 'later') push({ kind: '後で確認', slot: k, label: m.label, blocking: m.weight >= 3, owner: '顧客', reason: '回答者が「後で確認」' });
    }
    for (const c of Object.values(state.contradictions)) {
      if (c.status === 'open') push({ kind: '矛盾', slot: c.slots.join(','), label: c.label, blocking: c.severity >= 3, owner: 'FDE＋顧客', reason: '確認前' });
      else if (c.status === 'accepted') push({ kind: '条件付き', slot: c.slots.join(','), label: c.label, blocking: false, owner: 'FDE', reason: '「場合によって違う」→ 業務ルールとして条件を整理する' });
    }
    for (const f of Object.values(state.families)) {
      if (f.open) push({ kind: '仮説未検証', slot: f.id, label: f.label, blocking: false, owner: 'FDE', reason: '競合する仮説が' + f.alive + '件残っている' });
    }
    for (const k of state.reqOrder) {
      const r = state.reqs[k];
      if (r.status === 'rejected') push({ kind: '否認', slot: k, label: r.title, blocking: r.moscow === 'Must', owner: 'FDE', reason: '顧客が「ちがう」：' + (r.confirmNote || '理由未記入') });
      if (r.status === 'held') push({ kind: '保留', slot: k, label: r.title, blocking: false, owner: '顧客', reason: '確認を保留' });
    }
    for (const o of state.orphans) push({ kind: '前提変更', slot: o.iid, label: '回答 #' + o.seq + ' は使われていない', blocking: false, owner: 'FDE', reason: o.reason });
    if (state.tech && state.tech.missingInputs.length) push({ kind: '技術判断の材料不足', slot: state.tech.missingInputs.join(','), label: '技術構成を決める材料', blocking: true, owner: 'FDE', reason: state.tech.missingInputs.map((k) => engine.slotLabel(db, k)).join('、') });
    return list;
  }

  /** 人間（FDE）レビュー待ち：自動で意味を判定できない自由記述 */
  function reviewQueue(db, state) {
    const out = [];
    for (const a of state.answers) {
      if (a.kind !== 'value' || !a.det) continue;
      const reasons = [];
      if (a.det.abstract) reasons.push('抽象的');
      if (a.det.solutionOnly) reasons.push('手段だけ');
      if (a.det.needsEvidence) reasons.push('根拠なしの評価語');
      if (a.det.speculative) reasons.push('推量');
      if (a.det.correction) reasons.push('訂正の言葉');
      reasons.push('自由記述→要件への変換は人が確認');
      out.push({ seq: a.seq, iid: a.iid, raw: a.value, reasons, explain: a.explain || [], reviewed: !!(state.fdeReviewed && state.fdeReviewed[a.seq]) });
    }
    return out;
  }

  function ratio(a, b) { return b === 0 ? null : util.round(a / b, 2); }

  function metrics(db, state) {
    const crit = Object.keys(db.slots).filter((k) => db.slots[k].critical && activeTopic(db, state, k));
    const answered = crit.filter((k) => state.slots[k] && cond.KNOWN.includes(state.slots[k].status));
    const resolvedAny = crit.filter((k) => state.slots[k] && cond.RESOLVED.includes(state.slots[k].status));

    // Q2 事実と仮説の区別：自由記述のうち、本人が「事実／推測／希望」を選んだもの
    const epiTargets = state.answers.filter((a) => a.kind === 'value' && db.qIndex[a.qid] && db.qIndex[a.qid].epistemic);
    const epiDone = epiTargets.filter((a) => {
      const q = engine.resolveQuestion(db, state, a.iid);
      return q && state.slots[q.slot + '__epi'] && cond.RESOLVED.includes(state.slots[q.slot + '__epi'].status);
    });
    // Q3 競合仮説：有効な仮説群のうち、反証条件があり判別質問を一つ以上聞いたもの
    const fams = Object.values(state.families).filter((f) => f.active);
    const famTestable = fams.filter((f) => {
      const hs = Object.values(state.hyps).filter((h) => h.family === f.id);
      return hs.every((h) => h.falsifier) && hs.some((h) => h.discriminators.some((q) => state.asked[q]));
    });
    // Q4 目的と機能のつながり
    const reqs = state.reqOrder.map((k) => state.reqs[k]);
    const frs = reqs.filter((r) => r.type === 'FR');
    const frLinked = frs.filter((r) => r.parent && state.reqs[r.parent]);
    const brs = reqs.filter((r) => r.type === 'BR');
    const brWithFr = brs.filter((b) => frs.some((f) => f.parent === b.key));
    // Q5 データ・権限・例外
    const ents = reqs.filter((r) => r.type === 'ENT');
    const entClear = ents.filter((r) => {
      const p = r.key.replace(/^ENT-/, '');
      return ['count', 'id'].every((s) => state.slots['DAT.' + p + '.' + s] && cond.RESOLVED.includes(state.slots['DAT.' + p + '.' + s].status));
    });
    const dpeSlots = ['ROLE.see_scope', 'ROLE.edit_scope', 'RULE.exceptions'].filter((k) => db.slots[k]);
    const dpeDone = dpeSlots.filter((k) => state.slots[k] && cond.RESOLVED.includes(state.slots[k].status));
    // Q7 顧客確認
    const conf = Object.values(state.confirmations);
    const confirmed = conf.filter((c) => c.status === 'confirmed');
    // Q8 効率
    const asked = state.answers.length;
    const totalQ = db.questions.filter((q) => !q.generic).length;
    const dk = state.answers.filter((a) => a.kind === 'dontknow' || a.kind === 'later').length;
    const oi = openIssues(db, state);
    const unresolvedCrit = crit.filter((k) => !(state.slots[k] && cond.KNOWN.includes(state.slots[k].status)));

    return {
      Q1_ambiguityResolved: { value: ratio(answered.length, crit.length), detail: answered.length + '/' + crit.length + ' 件の重要項目に回答（わからない・後で確認を含む処理済み ' + resolvedAny.length + '）' },
      Q2_factVsHypothesis: { value: ratio(epiDone.length, epiTargets.length), detail: '自由記述 ' + epiTargets.length + ' 件中 ' + epiDone.length + ' 件を本人が「事実／推測／希望」に分類' },
      Q3_hypothesesTestable: { value: ratio(famTestable.length, fams.length), detail: '有効な仮説群 ' + fams.length + ' のうち反証条件＋判別質問あり ' + famTestable.length },
      Q4_goalToFunction: { value: ratio(frLinked.length, frs.length), detail: '機能要件 ' + frs.length + ' のうち事業要求に紐づく ' + frLinked.length + '／機能につながる事業要求 ' + brWithFr.length + '/' + brs.length },
      Q5_dataRoleException: { value: ratio(entClear.length + dpeDone.length, ents.length + dpeSlots.length), detail: 'データ ' + entClear.length + '/' + ents.length + '（件数と見分け方）・権限と例外 ' + dpeDone.length + '/' + dpeSlots.length },
      Q6_openIssuesIdentified: { value: unresolvedCrit.every((k) => oi.some((o) => o.slot === k)) ? 1 : 0, detail: '未解決の重要項目 ' + unresolvedCrit.length + ' 件すべてを未決定事項に登録（計 ' + oi.length + ' 件、うち実装を止めるもの ' + oi.filter((o) => o.blocking).length + '）' },
      Q7_customerConfirmed: { value: ratio(confirmed.length, conf.length), detail: '確認 ' + conf.length + ' 件中「合っている」' + confirmed.length + '・「ちがう」' + conf.filter((c) => c.status === 'rejected').length },
      Q8_efficiency: { value: ratio(resolvedAny.length, asked), detail: '質問 ' + asked + ' 問／DB ' + totalQ + ' 問（' + (totalQ - asked) + ' 問は規則で不要と判断して出していない）・わからない/後で ' + dk + '・経過 ' + util.round(state.elapsedSec / 60, 1) + ' 分' },
    };
  }

  /** 仕様確定の判定（R01〜R07）。推定のままの要件がある案件を「確定」と呼ばない */
  function readiness(db, state) {
    const reqs = state.reqOrder.map((k) => state.reqs[k]);
    const must = reqs.filter((r) => r.moscow === 'Must' && ['FR', 'NFR'].includes(r.type));
    const oi = openIssues(db, state);
    const checks = [
      { id: 'R01', label: 'Must の機能・非機能要件がすべて顧客確認済み', ok: must.every((r) => r.status === 'confirmed'), hard: true },
      { id: 'R02', label: '実装を止める未決定事項が0件', ok: oi.filter((o) => o.blocking).length === 0, hard: true },
      { id: 'R03', label: '事業要求が1つ以上あり、すべて顧客確認済み', ok: reqs.some((r) => r.type === 'BR') && reqs.filter((r) => r.type === 'BR').every((r) => r.status === 'confirmed'), hard: true },
      { id: 'R04', label: '扱うデータの件数と見分け方がわかっている', ok: reqs.filter((r) => r.type === 'ENT').every((r) => { const p = r.key.replace(/^ENT-/, ''); return state.slots['DAT.' + p + '.count'] && state.slots['DAT.' + p + '.id']; }), hard: false },
      { id: 'R05', label: '技術判断の必須材料がそろっている', ok: state.tech && state.tech.missingInputs.length === 0, hard: false },
      { id: 'R06', label: '個人情報があれば、利用目的・保存期間・閲覧者・外部送信可否が確認済み', ok: !(state.slots['DAT.pii'] && Array.isArray(state.slots['DAT.pii'].value) && state.slots['DAT.pii'].value.some((x) => x !== 'なし')) || ['DAT.retention', 'ROLE.see_scope', 'NFR.external_send'].every((k) => state.slots[k] && cond.KNOWN.includes(state.slots[k].status)), hard: true },
      { id: 'R07', label: '構造化項目どうしの矛盾が未確認のまま残っていない', ok: Object.values(state.contradictions).every((c) => c.status !== 'open'), hard: false },
      { id: 'R08', label: '有効な論点の重要項目に、未確認・わからない・後で確認が残っていない', ok: oi.filter((o) => ['未確認', 'わからない', '後で確認'].includes(o.kind)).length === 0, hard: false },
      { id: 'R09', label: '人間レビュー待ちの自由記述を FDE がすべて確認した', ok: reviewQueue(db, state).every((r) => state.fdeReviewed && state.fdeReviewed[r.seq]), hard: false, manual: true },
    ];
    const hardFail = checks.some((c) => c.hard && !c.ok);
    const softFail = checks.some((c) => !c.hard && !c.ok);
    return { verdict: hardFail ? '未確定' : softFail ? '条件付き' : '仕様確定', checks };
  }

  const api = { activeTopic, openIssues, reviewQueue, metrics, readiness };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else { root.FDE = root.FDE || {}; root.FDE.quality = api; }
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/*
 * report.js — 出力（要件定義書 Markdown／スプレッドシート貼り付け用 TSV）
 * 推定と確認済みを必ず分けて書く。お客様が訂正した点を先頭に置く（訂正は重要な情報）。
 */
(function (root) {
  'use strict';
  const isNode = typeof require === 'function';
  const engine = isNode ? require('./engine.js') : root.FDE.engine;
  const quality = isNode ? require('./quality.js') : root.FDE.quality;
  const derive = isNode ? require('./derive.js') : root.FDE.derive;

  const STATUS = { unconfirmed: '未確認（推定）', confirmed: '確認済み', rejected: 'ちがう（否認）', held: '保留', na: '該当しない' };
  const ORIGIN = { customer: 'お客様の回答', rule: 'ルールによる推定' };
  const EPI = { fact: '事実（見た・数えた）', heard: '伝聞', guess: '推測', wish: '希望', mixed: '混在' };
  const TYPE = { VIS: '事業の思い', BR: '事業要求', SR: '関係者要求', FR: '機能要件', NFR: '非機能要件', BP: '業務プロセス', RULE: '業務ルール', ENT: 'データ（まとまり）', ATTR: 'データ（項目）', REL: 'データ（関係）', STATE: '状態', ROLE: '立場', PERM: '見える範囲・できること', INT: '外部連携', CON: '制約', MIG: '移行', AC: '受け入れ条件', ADR: '技術・方針の決定', CR: '変更要求' };

  function fmt(v) {
    if (v == null) return '';
    if (v === true) return 'はい';
    if (v === false) return 'いいえ';
    if (Array.isArray(v)) return v.join('、');
    if (typeof v === 'object') return Object.entries(v).map(([k, x]) => k + ':' + (Array.isArray(x) ? x.join('/') : x)).join('、');
    return String(v);
  }
  const esc = (s) => String(s == null ? '' : s).replace(/\|/g, '｜').replace(/\n/g, ' ');

  function answerText(db, state, a) {
    if (a.kind !== 'value') return '［' + engine.SPECIAL[a.kind] + '］';
    const q = engine.resolveQuestion(db, state, a.iid);
    if (q && q.input && q.input.options && !Array.isArray(a.value) && typeof a.value !== 'object') {
      const o = q.input.options.find((x) => x.v === a.value);
      if (o) return o.label;
    }
    if (q && q.input && q.input.type === 'yesno') return a.value ? (q.input.yes || 'はい') : (q.input.no || 'いいえ');
    if (a.value && typeof a.value === 'object' && !Array.isArray(a.value) && 'yes' in a.value) {
      const lab = (v) => { const o = q && q.input && q.input.options && q.input.options.find((x) => x.v === v); return o ? o.label : v; };
      return '当てはまる：' + (a.value.yes || []).map(lab).join('、') + '／ちがう：' + (a.value.no || []).map(lab).join('、') + '／わからない：' + (a.value.unknown || []).map(lab).join('、');
    }
    return fmt(a.value);
  }

  function epistemicOf(state, slot) {
    const e = state.slots[slot + '__epi'];
    return e && e.value ? EPI[e.value] || e.value : '';
  }

  function markdown(db, state, session) {
    const L = [];
    const meta = session.meta;
    const rd = quality.readiness(db, state);
    const mt = quality.metrics(db, state);
    const oi = quality.openIssues(db, state);
    const rv = quality.reviewQueue(db, state);
    const reqs = state.reqOrder.map((k) => state.reqs[k]);
    const byType = (t) => reqs.filter((r) => r.type === t);

    L.push('# 要件定義書（ヒアリング結果）— ' + (meta.title || meta.id));
    L.push('');
    L.push('| 項目 | 内容 |', '|---|---|');
    L.push('| 案件ID | ' + meta.id + ' |');
    L.push('| 回答者 | ' + meta.respondents.map((r) => r.name + '（' + r.role + '）').join('、') + ' |');
    L.push('| 作成 | ' + meta.createdAt + ' |');
    L.push('| 質問DB・ルール版 | ' + db.version + '（ルール ' + db.params.ruleVersion + '）|');
    L.push('| 判定 | **' + rd.verdict + '**（「未確定」「条件付き」は開発仕様として扱わない）|');
    L.push('| 回答数・経過 | ' + state.answers.length + ' 問・' + Math.round(state.elapsedSec / 60) + ' 分 |');
    L.push('');
    L.push('> この文書はルールで自動生成しています。「未確認（推定）」はお客様の合意前の仮の内容です。自由記述の意味はツールでは判定していません（§14 人間レビュー）。');
    L.push('');

    L.push('## 1. お客様が訂正・否定した点');
    if (!state.corrections.length) L.push('なし');
    else {
      L.push('| # | 種類 | 訂正前 | 訂正後 |', '|---|---|---|---|');
      for (const c of state.corrections) L.push('| ' + c.seq + ' | ' + ({ edit: '回答の訂正', retract: '回答の取り消し', 'confirm-reject': '確認で「ちがう」', 'text-correction-word': '訂正の言葉' })[c.kind] + ' | ' + esc(fmt(c.before)) + ' | ' + esc(fmt(c.after)) + ' |');
    }
    L.push('');

    L.push('## 2. 依頼者の理解（事業・思い・言葉）');
    const visKeys = Object.keys(db.slots).filter((k) => k.startsWith('VIS.'));
    L.push('| 項目 | 回答 | 分類 |', '|---|---|---|');
    for (const k of visKeys) {
      const s = state.slots[k];
      if (s) L.push('| ' + db.slots[k].label + ' | ' + esc(s.status === 'answered' ? fmt(s.value) : '［' + (engine.SPECIAL[s.status] || s.status) + '］') + ' | ' + (epistemicOf(state, k) || (s.origin === 'text' ? '未分類' : '選択')) + ' |');
    }
    if (state.slots['VIS.tradeoff']) L.push('', '迷ったときの優先（10点配分）：' + fmt(state.slots['VIS.tradeoff'].value));
    L.push('');

    const reqTable = (list, cols) => {
      if (!list.length) { L.push('（なし）', ''); return; }
      L.push('| ID | 内容 | 状態 | 出どころ | 根拠（回答#・ルール） |' + (cols ? ' 受け入れ条件 | 優先 |' : ''), '|---|---|---|---|---|' + (cols ? '---|---|' : ''));
      for (const r of list) {
        L.push('| ' + r.key + ' | ' + esc(r.title) + (r.parent ? '（←' + r.parent + '）' : '') + ' | ' + STATUS[r.status] + ' | ' + ORIGIN[r.origin] + ' | ' + (r.answerSeqs.length ? '#' + r.answerSeqs.join(',#') : '-') + ' / ' + r.rules.join(',') + ' |' + (cols ? ' ' + esc(r.ac || '') + ' | ' + (r.moscow || '未定') + ' |' : ''));
      }
      L.push('');
    };

    L.push('## 3. 事業要求と成果の測り方');
    const pr = state.slots['BR.problem'];
    if (pr && pr.value) L.push('- 困りごと（原文）：「' + pr.value + '」— 本人の分類：' + (epistemicOf(state, 'BR.problem') || '未分類') + '／根拠：' + fmt((state.slots['BR.evidence'] || state.slots['BR.problem__evidence'] || {}).value || '未確認'));
    const req = state.slots['PRJ.request_raw'];
    if (req && req.value) L.push('- 相談の原文：「' + req.value + '」');
    L.push('');
    reqTable(byType('BR').concat(byType('VIS')));

    L.push('## 4. 業務プロセスと業務ルール');
    reqTable(byType('BP').concat(byType('RULE')).concat(byType('STATE').filter((r) => r.key === 'STATE-APPROVAL')));

    L.push('## 5. 機能要件');
    reqTable(byType('FR'), true);

    L.push('## 6. データ（扱う情報・項目・関係・状態）');
    reqTable(byType('ENT').concat(byType('ATTR')).concat(byType('REL')).concat(byType('STATE').filter((r) => r.key !== 'STATE-APPROVAL')));
    const ents = derive.slotVal(state, 'DAT.things') || [];
    if (ents.length) {
      L.push('```mermaid', 'erDiagram');
      for (const e of ents) L.push('  ' + e + ' { string id "' + fmt(derive.slotVal(state, 'DAT.' + e + '.id') || '見分け方未定') + '" }');
      for (const r of db.rules.entities.relations) {
        if (!ents.includes(r.a) || !ents.includes(r.b)) continue;
        const v = derive.slotVal(state, r.slot);
        const rel = v == null ? '}o..o{' : v === r.one ? '||--||' : '||--o{';
        L.push('  ' + r.a + ' ' + rel + ' ' + r.b + ' : "' + (v == null ? '未確認' : v) + '"');
      }
      L.push('```', '');
    }

    L.push('## 7. 使う人と見える範囲');
    reqTable(byType('ROLE').concat(byType('PERM')));

    L.push('## 8. 外部連携・移行');
    reqTable(byType('INT').concat(byType('MIG')));

    L.push('## 9. 非機能要件');
    reqTable(byType('NFR'), true);

    L.push('## 10. 制約・受け入れ条件・決定');
    reqTable(byType('CON').concat(byType('AC')).concat(byType('ADR')).concat(byType('CR')), true);

    L.push('## 11. 技術構成の候補（ノックアウト → 重み付け。確定ではない）');
    const t = state.tech;
    L.push('材料：' + (t.confident ? 'そろっている' : '不足（' + t.missingInputs.map((k) => engine.slotLabel(db, k)).join('、') + '）') + '。上限・料金の確認日：' + t.checkedAt);
    L.push('', '| 順 | 構成 | 判定 | 点（1〜5） | 除外・注意の理由 | トレードオフ |', '|---|---|---|---|---|---|');
    t.ranked.forEach((a, i) => L.push('| ' + (i + 1) + ' | ' + a.id + ' ' + a.label + ' | ' + ({ candidate: '候補', check: '要確認', excluded: '除外' })[a.status] + ' | ' + a.score + ' | ' + esc(a.reasons.concat(a.warnings.map((w) => '注意：' + w)).join('／')) + ' | ' + esc(t.tradeoffs[a.id]) + ' |'));
    const top = t.ranked.filter((a) => a.status !== 'excluded').slice(0, 2);
    L.push('', '### ADR 下書き：技術構成', '- ステータス：提案（顧客・FDEの合意前）', '- 検討した案：' + top.map((a) => a.id + ' ' + a.label).join(' ／ '));
    if (top.length === 2 && Math.abs(top[0].score - top[1].score) < 0.3) L.push('- 上位2案の差が小さい → 「やり直しのしやすさ」で決める（zip 04 §5 の運用ルール）');
    L.push('- 除外した案：' + t.ranked.filter((a) => a.status === 'excluded').map((a) => a.id + '（' + a.reasons.join('・') + '）').join('、'));
    L.push('- 見直しのきっかけ：利用人数・月間件数・見える範囲の条件が変わったとき', '');

    L.push('## 12. 未決定事項');
    if (!oi.length) L.push('なし');
    else {
      L.push('| ID | 種類 | 内容 | 実装を止めるか | 確認する人 | 理由 |', '|---|---|---|---|---|---|');
      for (const o of oi) L.push('| ' + o.id + ' | ' + o.kind + ' | ' + esc(o.label) + ' | ' + (o.blocking ? '止める' : '') + ' | ' + esc(o.owner) + ' | ' + esc(o.reason) + ' |');
    }
    L.push('');

    L.push('## 13. 仮説（競合仮説と反証条件）');
    for (const f of Object.values(state.families).filter((x) => x.active)) {
      L.push('### ' + f.label + (f.open ? '（未決着）' : ''), '決まること：' + (f.decides || []).join('、'), '', '| 仮説 | 状態 | 反証条件 |', '|---|---|---|');
      for (const h of Object.values(state.hyps).filter((x) => x.family === f.id)) L.push('| ' + h.label + ' | ' + ({ alive: '未検証', supported: '支持', refuted: '反証', inactive: '-' })[h.status] + ' | ' + esc(h.falsifier) + ' |');
      L.push('');
    }

    L.push('## 14. 人間レビュー待ち（自由記述：ツールは意味を判定していない）');
    if (!rv.length) L.push('なし');
    else {
      L.push('| 回答# | 原文 | 本人の分類 | 自動の手がかり |', '|---|---|---|---|');
      for (const r of rv) {
        const q = engine.resolveQuestion(db, state, r.iid);
        L.push('| ' + r.seq + ' | ' + esc(r.raw) + ' | ' + (q && q.slot ? epistemicOf(state, q.slot) || '未分類' : '') + ' | ' + esc(r.reasons.join('・')) + ' |');
      }
    }
    L.push('');

    L.push('## 15. 矛盾の確認');
    const cs = Object.values(state.contradictions);
    if (!cs.length) L.push('なし（構造化項目どうしの検出規則に該当なし。自由記述どうしの矛盾は検出していない）');
    else for (const c of cs) L.push('- ' + c.label + '：' + ({ open: '未確認', accepted: '確認済み（「場合による」等）' })[c.status]);
    L.push('');

    L.push('## 16. ヒアリング品質と仕様確定の判定');
    L.push('| 指標 | 値 | 内訳 |', '|---|---|---|');
    for (const k of Object.keys(mt)) L.push('| ' + k + ' | ' + (mt[k].value == null ? '-' : mt[k].value) + ' | ' + esc(mt[k].detail) + ' |');
    L.push('', '| 判定ルール | 結果 |', '|---|---|');
    for (const c of rd.checks) L.push('| ' + c.id + ' ' + c.label + (c.hard ? '（必須）' : '') + ' | ' + (c.ok ? '○' : '×') + ' |');
    L.push('');

    L.push('## 17. 回答ログ');
    L.push('| # | 質問 | 回答 | 秒 | 回答者 |', '|---|---|---|---|---|');
    for (const a of state.answers) {
      const q = engine.resolveQuestion(db, state, a.iid);
      L.push('| ' + a.seq + ' | ' + esc(q ? q.text : a.iid) + ' | ' + esc(answerText(db, state, a)) + ' | ' + Math.round(a.ms / 1000) + ' | ' + a.persona + ' |');
    }
    return L.join('\n');
  }

  /** スプレッドシートに貼る用（タブ区切り）。1行目が見出し */
  function tsv(rows) {
    return rows.map((r) => r.map((c) => String(c == null ? '' : c).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
  }

  function sheets(db, state, session) {
    const reqs = state.reqOrder.map((k) => state.reqs[k]);
    return {
      requirements: tsv([['案件ID', '要件ID', '種類', '内容', '顧客向けの文', '状態', '出どころ', '親', '優先', '受け入れ条件', '根拠の回答#', '変換ルール', '根拠資料']]
        .concat(reqs.map((r) => [session.meta.id, r.key, TYPE[r.type] || r.type, r.title, r.plain || '', STATUS[r.status], ORIGIN[r.origin], r.parent || '', r.moscow || '', r.ac || '', r.answerSeqs.join(','), r.rules.join(','), r.sources.join(',')]))),
      openIssues: tsv([['案件ID', 'ID', '種類', '内容', '実装を止める', '確認する人', '理由']]
        .concat(quality.openIssues(db, state).map((o) => [session.meta.id, o.id, o.kind, o.label, o.blocking ? 'はい' : '', o.owner, o.reason]))),
      answers: tsv([['案件ID', '回答#', '質問ID', '質問', '何を判定するか', '回答で決まること', '回答', '本人の分類', '秒', '回答者の立場', 'ルール版']]
        .concat(state.answers.map((a) => {
          const q = engine.resolveQuestion(db, state, a.iid);

  const api = { markdown, sheets, answerText, fmt, STATUS, ORIGIN, TYPE };
